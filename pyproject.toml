[project]
name = "ace"
version = "0.1"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk==0.1.23",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "math-verify[antlr4-11-0]==0.9.0",
    "pydantic-ai-slim[openai]>=2.46",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]         # tests — для stub и в tests/bridge
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]

[tool.ruff]
extend-exclude = ["ace/matharena", "ace/memory/mce_utils"]   # дословный код MathArena и утилит workspace MCE
