[project]
name = "ace"
version = "0.1"
requires-python = ">=3.11"
dependencies = ["pydantic-ai-slim[openai]>=2.46", "sentence-transformers>=3.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
